# =========================================================
#  OR Journal Digest 配置文件
#  改完后提交到仓库即可，下次运行自动生效
# =========================================================

# Crossref “礼貌池”联系邮箱（会放在请求参数里，提高稳定性；建议填写）
contact_email: "your-email@example.com"

# ---------------------------------------------------------
